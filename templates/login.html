<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar - Superior Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="login-body">
  {% if flashes %}
  <div class="flash-container">
    {% for f in flashes %}
    <div class="flash {{ f.tipo }}">{{ f.mensaje }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <div class="login-container">
    <div class="login-logo-wrap">
      <div class="login-logo-circle">SG</div>
    </div>
    <div class="login-brand"><span class="brand-1">Superior</span> <span class="brand-2">Group</span></div>
    <div class="login-sub">Arquitectura e Ingeniería · Portal de Gestión</div>

    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
